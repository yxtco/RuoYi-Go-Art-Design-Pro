# ============================================================
# 前后端容器（开发式）部署专用配置：`go run main.go -c deploy`
# 本环境只创建 backend + web 两个容器，MySQL / Redis 由宿主机提供。
# 后端容器通过 host.docker.internal 访问宿主机（compose 里已配置
# extra_hosts: host.docker.internal:host-gateway）。
#
# 修改本文件后，重新启动后端容器即可生效（无需重建镜像）：
#   docker compose -f deploy/docker-compose.yml restart backend
# ============================================================

# 服务器配置
server:
  port: 8080
  host: localhost
  web_dist: '/app/web-dist'   # 本方案前端由独立 web 容器托管，此处仅为兼容，不生效

# 数据库配置（宿主机 MySQL，地址 host.docker.internal）
database_list:
  - name: master            # 数据库连接名称
    driver: mysql           # 数据库驱动类型，支持 mysql、postgres
    host: host.docker.internal # 宿主机地址（Linux 由 extra_hosts: host-gateway 解析）
    port: 3306              # 数据库端口
    username: root          # 数据库用户名
    password: 'Jerry322'    # 数据库密码（请按宿主机实际 MySQL 密码修改）
    database: ry-test       # 数据库名称
    logLevel: 1             # 日志级别：1=Silent 2=Error 3=Warn 4=Info

# 日志配置
log:
  level: standard        # 日志级别：quiet(不记录操作日志) / standard(仅记录写操作) / detailed(记录所有请求)
  format: json           # 日志格式：text, json
  dir: /app/logs         # 日志文件存储目录（挂载到宿主机 server/logs，持久化）
  max_size: 20           # 单个日志文件最大大小(MB)
  max_backups: 5         # 保留的旧日志文件数量
  max_age: 7             # 保留旧日志文件的最大天数
  compress: true         # 是否压缩旧日志文件

# 缓存配置（宿主机 Redis，地址 host.docker.internal）
redis_list:
  - name: master
    addr: 'host.docker.internal:6380' # 宿主机 Redis 地址（请按实际端口/密码修改）
    password: 'Jerry322'              # Redis 密码
    db: 5                             # Redis 数据库编号

