# ============================================================
# Docker 部署专用配置（嵌入二进制，容器内通过 -c docker 加载）
# 数据库/Redis 指向同网络的 mysql/redis 容器服务名
# ============================================================

# 服务器配置
server:
  port: 8080
  host: 0.0.0.0
  web_dist: '/app/web-dist'   # 前端编译产物目录（后端直接托管）

# 数据库配置（容器内服务名 mysql）
database_list:
  - name: master            # 数据库连接名称
    driver: mysql           # 数据库驱动类型，支持 mysql、postgres
    host: host.docker.internal  # 数据库主机地址（宿主机 MySQL）
    port: 3306              # 数据库端口
    username: root          # 数据库用户名
    password: 'Jerry322'    # 数据库密码
    database: ry-go         # 数据库名称
    logLevel: 1             # 日志级别：1=Silent 2=Error 3=Warn 4=Info

# 日志配置
log:
  level: standard        # 日志级别：quiet(不记录操作日志) / standard(仅记录写操作) / detailed(记录所有请求)
  format: json           # 日志格式：text, json
  dir: /app/logs         # 日志文件存储目录
  max_size: 20           # 单个日志文件最大大小(MB)
  max_backups: 5         # 保留的旧日志文件数量
  max_age: 7             # 保留旧日志文件的最大天数
  compress: true         # 是否压缩旧日志文件

# 缓存配置（容器内服务名 redis）
redis_list:
  - name: master
    addr: 'host.docker.internal:6380'
    password: 'Jerry322'
    db: 5

