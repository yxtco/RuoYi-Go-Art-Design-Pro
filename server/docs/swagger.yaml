basePath: /
definitions:
  go-fin-server_api_common.LoginRequest:
    properties:
      code:
        type: string
      password:
        type: string
      username:
        type: string
      uuid:
        type: string
    required:
    - password
    - username
    type: object
info:
  contact: {}
  description: 若依 Go 版本接口文档
  title: RuoYi-Go API
  version: "1.0"
paths:
  /captchaImage:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 验证码图片base64和uuid
          schema:
            additionalProperties: true
            type: object
      summary: 获取验证码图片
      tags:
      - 登录
  /common/download:
    get:
      parameters:
      - description: 文件名称
        in: query
        name: fileName
        required: true
        type: string
      - description: 下载后是否删除
        in: query
        name: delete
        type: boolean
      produces:
      - application/octet-stream
      responses:
        "200":
          description: 文件内容
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: 通用文件下载
      tags:
      - 公共上传
  /common/download/resource:
    get:
      parameters:
      - description: 资源路径
        in: query
        name: resource
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: 文件内容
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: 下载资源文件
      tags:
      - 公共上传
  /common/sequence/batch:
    post:
      consumes:
      - application/json
      parameters:
      - description: 批量生成参数 {businessType, prefix, datePattern, seqLength, resetCycle,
          count}
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: sequences:序号数组
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 批量生成序号
      tags:
      - 序号生成
  /common/sequence/current:
    get:
      parameters:
      - description: 业务类型
        in: query
        name: businessType
        required: true
        type: string
      - description: 序号前缀
        in: query
        name: prefix
        type: string
      - description: 日期格式
        in: query
        name: datePattern
        type: string
      - description: 序号位数
        in: query
        name: seqLength
        type: integer
      - description: 重置周期
        in: query
        name: resetCycle
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: currentSequence:当前序号值
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取当前序号值
      tags:
      - 序号生成
  /common/sequence/next:
    get:
      parameters:
      - description: 业务类型（如 ORDER, INVOICE）
        in: query
        name: businessType
        required: true
        type: string
      - description: 序号前缀（如 ORD, INV）
        in: query
        name: prefix
        type: string
      - description: 日期格式（如 20060102, 200601, 空串不拼接日期）
        in: query
        name: datePattern
        type: string
      - description: 序号位数（默认3，如 3 → 001）
        in: query
        name: seqLength
        type: integer
      - description: '重置周期: daily/monthly/yearly/never（默认 daily）'
        in: query
        name: resetCycle
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: sequence:生成的完整序号
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 生成下一个序号
      tags:
      - 序号生成
  /common/sequence/reset:
    delete:
      parameters:
      - description: 业务类型
        in: query
        name: businessType
        required: true
        type: string
      - description: 重置周期
        in: query
        name: resetCycle
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 操作结果
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 重置序号
      tags:
      - 序号生成
  /common/upload:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: 上传文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: fileName:文件路径,newFileName:文件名,url:完整URL,originalFilename:原始文件名
